# Builds the headless simulation container, compiles firmware, Zephyr apps,
# and verilated libraries, then runs the full digital twin test suite.

name: Digital Twin Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build simulation container
        run: docker build -t elemrv-sim:test -f docker/Dockerfile.simulation docker/

      - name: Start container
        run: |
          docker run -d --name elemrv-test \
            -v ${{ github.workspace }}:/workspace/elemrv \
            -w /workspace/elemrv \
            elemrv-sim:test sleep infinity

      - name: Configure git safe directories
        run: |
          docker exec elemrv-test \
            git config --global --add safe.directory "*"

      - name: Build bare-metal firmware
        run: |
          docker exec elemrv-test bash -c '
            cd /workspace/elemrv/software/elemrv_h/pwm_test &&
            make clean && make all && make regtest'

      - name: Build all verilated co-simulation libraries
        run: |
          docker exec elemrv-test bash -c '
            cd /workspace/elemrv/renode/verilated/wrappers &&
            bash build_all_cosim.sh release'

      - name: Initialize Zephyr workspace
        run: |
          docker exec elemrv-test bash -c '
            cd /workspace/elemrv/software &&
            west init -l elemrv-zephyr &&
            west update'

      - name: Build all Zephyr apps
        run: |
          docker exec elemrv-test bash -c '
            export ZEPHYR_BASE=/workspace/elemrv/software/zephyr
            cd /workspace/elemrv/software/elemrv-zephyr &&
            bash build_all_apps.sh'

      - name: Run pure Verilator testbenches
        run: |
          docker exec elemrv-test bash -c '
            cd /workspace/elemrv/renode/verilated/testbenches && make run'

      - name: Run digital twin tests
        run: |
          docker exec elemrv-test bash -c '
            cd /workspace/elemrv/renode && bash run_tests.sh'

      - name: Cross-validate co-simulation
        if: always()
        run: |
          docker exec elemrv-test bash -c '
            cd /workspace/elemrv/renode && bash validate_cosim.sh' || true

      - name: Collect test logs
        if: always()
        run: |
          mkdir -p test-logs
          for i in $(seq 1 23); do
            docker cp elemrv-test:/tmp/dt_test_${i}.log test-logs/ 2>/dev/null || true
          done
          docker cp elemrv-test:/tmp/dt_verilator_tb.log test-logs/ 2>/dev/null || true
          docker cp elemrv-test:/tmp/dt_crossval test-logs/crossval/ 2>/dev/null || true

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-twin-test-logs
          path: test-logs/

      - name: Cleanup
        if: always()
        run: docker rm -f elemrv-test || true
