version: '3.8'

services:
  renode:
    build:
      context: .
      dockerfile: Dockerfile.simulation
    image: elemrv-sim:latest
    container_name: elemrv-test
    volumes:
      - ..:/workspace/elemrv
    working_dir: /workspace/elemrv
    ports:
      - "3333:3333"
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RENODE_ROOT=/opt/renode_1.16.0_portable
    # For GUI support on Linux
    # network_mode: host
    stdin_open: true
    tty: true
    command: /bin/bash

  test:
    build:
      context: .
      dockerfile: Dockerfile.simulation
    image: elemrv-sim:latest
    container_name: elemrv-test
    volumes:
      - ..:/workspace/elemrv
    working_dir: /workspace/elemrv
    environment:
      - RENODE_ROOT=/opt/renode_1.16.0_portable
    profiles:
      - test
    command: bash -c 'cd renode && bash run_tests.sh'
