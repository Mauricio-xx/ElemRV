version = 1

[[annotations]]
path = "images/*"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "CERN-OHL-W-2.0"

[[annotations]]
path = "project/*"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "CERN-OHL-W-2.0"

[[annotations]]
path = ".scalafmt.conf"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "CERN-OHL-W-2.0"

[[annotations]]
path = "software/*/spi.layout"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "tmp/*/*"
SPDX-FileCopyrightText = "2026 aesc silicon"
SPDX-License-Identifier = "CERN-OHL-W-2.0"

# ---------------------------------------------------------------------------
# Digital Twin branch annotations.
# These fill in SPDX-FileCopyrightText for files that declare a license inline
# but not a copyright (most of the Zephyr module + resc test drivers), and
# give full SPDX info to generated artefacts and docs that never carried
# headers. In-file headers, when present, take precedence over these entries.
# ---------------------------------------------------------------------------

# Zephyr out-of-tree module for ElemRV: drivers, boards, SoCs, DT bindings.
# Most files already declare Apache-2.0 inline; this fills in the missing
# copyright for them, and full SPDX for the remaining board/DT yaml/Kconfig
# fragments that ship without headers.
[[annotations]]
path = "software/elemrv-zephyr/**"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "Apache-2.0"

# Digital twin documentation (both docs/digital-twin and the older
# renode/docs tree).
[[annotations]]
path = "docs/digital-twin/**"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "CERN-OHL-W-2.0"

[[annotations]]
path = "renode/docs/**"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "CERN-OHL-W-2.0"

# Renode platform descriptions and test driver scripts. Most declare
# Apache-2.0 inline but lack copyright; the annotation merges the two.
[[annotations]]
path = "renode/platforms/*.repl"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "renode/*.resc"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "renode/scripts/**"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "Apache-2.0"

# Bare-metal firmware build artefacts. Sources carry inline Apache-2.0; the
# compiled .bin/.elf/.lst/.img copies inherit the same SPDX.
[[annotations]]
path = "renode/firmware/samples/**/*.bin"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "renode/firmware/samples/**/*.elf"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "renode/firmware/samples/**/*.lst"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "renode/firmware/samples/**/*.img"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "Apache-2.0"

# Legacy pwm_test build artefacts under software/elemrv_h.
[[annotations]]
path = "software/elemrv_h/pwm_test/*.bin"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "Apache-2.0"

# SpinalHDL-generated Verilog (reproducible output of hardware/scala/**).
[[annotations]]
path = "gen/**"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "CERN-OHL-W-2.0"

[[annotations]]
path = "gen_n/**"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "CERN-OHL-W-2.0"

# Tracked .gitignore files inside build/test subtrees.
[[annotations]]
path = "**/.gitignore"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "CERN-OHL-W-2.0"

# Local developer settings (gitignored — included here so local reuse lint
# stays clean even when these files happen to exist on disk).
[[annotations]]
path = ".claude/**"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "CERN-OHL-W-2.0"

[[annotations]]
path = ".opencode/**"
SPDX-FileCopyrightText = "2025 aesc silicon"
SPDX-License-Identifier = "CERN-OHL-W-2.0"
