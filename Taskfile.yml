version: '3'

includes:
  lib:
    taskfile: ./modules/elements/zibal/Taskfile.yaml
    optional: true
    flatten: true

env:
  FPGA_FAMILY: ecp5
  FPGA_DEVICE: um5g-45k
  FPGA_PACKAGE: CABGA554
  FPGA_FREQUENCY: 50
  OPENFPGALOADER_BOARD: ecpix5_r03
  PDK: ihp-sg13g2
  PDK_ROOT: "{{ .PWD }}/pdks/IHP-Open-PDK/"
  KLAYOUT_HOME: "{{ .PWD }}/pdks/IHP-Open-PDK/ihp-sg13g2/libs.tech/klayout/"
  NAFARR_BASE: "{{ .PWD }}/modules/elements/nafarr/"
  ZIBAL_BASE: "{{ .PWD }}/modules/elements/zibal/"
  BUILD_ROOT: "{{ .PWD }}/build/"
  GCC: "/opt/elements/zephyr-sdk-0.17.0/riscv64-zephyr-elf/bin/riscv64-zephyr-elf"
  OPENROAD_FLOW_ROOT: "{{ .PWD }}/tools/OpenROAD-flow-scripts/flow"

vars:
  SOC: '{{.SOC | default "ElemRV-N"}}'
  package:
    sh: echo "{{.SOC}}" | tr '[:upper:]' '[:lower:]' | tr '-' '_'
  CONTAINER_NAME: elemrv_container
  CONTAINER_ENV: " \
    -e SOC={{ .SOC }} \
    -e FPGA_FAMILY={{ .FPGA_FAMILY }} \
    -e FPGA_DEVICE={{ .FPGA_DEVICE }} \
    -e FPGA_PACKAGE={{ .FPGA_PACKAGE }} \
    -e FPGA_FREQUENCY={{ .FPGA_FREQUENCY }} \
    -e PDK={{ .PDK }} \
    -e PDK_ROOT={{ .PDK_ROOT }} \
    -e KLAYOUT_HOME={{ .KLAYOUT_HOME }} \
    -e NAFARR_BASE={{ .NAFARR_BASE }} \
    -e ZIBAL_BASE={{ .ZIBAL_BASE }} \
    -e BUILD_ROOT={{ .BUILD_ROOT }} \
    -e GCC={{ .GCC }} \
"


tasks:
  project-prepare:
    desc: Sets up a virtual environment, installs tools, and initializes project dependencies.
    cmds:
      - virtualenv venv
      - venv/bin/pip3 install podman-compose==1.0.6
      - curl https://storage.googleapis.com/git-repo-downloads/repo > repo
      - chmod a+rx repo
      - ./repo init -u https://github.com/aesc-silicon/ElemRV.git -b {{if .branch}}{{.branch}}{{else}}main{{end}} -m manifest{{if .nightly}}-nightly{{end}}.xml

  build-container:
    desc: Creates a container with all necessary host requirements pre-installed.
    cmds:
      - docker build -t elemrv-sim:latest -f docker/Dockerfile.simulation docker/
  repo-sync:
    desc: Downloads and synchronizes all required dependencies.
    cmds:
      - ./repo sync
  install:
    desc: Installs all dependencies and prepares the project for FPGA and chip workflows.
    cmds:
      - task: project-prepare
      - task: build-container
      - task: repo-sync
    vars:
      branch: "main"
      nightly: "false"

  fpga-prepare:
    desc: Produces the Verilog file and metadata needed for FPGA operations.
    cmds:
      - task: lib-generate
        vars:
          board: "ECPIX5"
  fpga-synthesize:
    desc: Generates the FPGA bitstream by synthesizing the design.
    cmds:
      - task: lib-synthesize-fpga
        vars:
          board: "ECPIX5"
          vendor: "Lattice"
  fpga-flash:
    desc: Programs the FPGA with the generated bitstream.
    cmds:
      - task: lib-flash-bitstream
        vars:
          board: "ECPIX5"
  fpga-simulate:
    desc: Runs simulations at the RTL level. Add 'duration=n' to specify the duration in n milliseconds.
    cmds:
      - task: lib-simulate
        vars:
          board: "ECPIX5"
  fpga-view-simulation:
    desc: Opens the simulation with GTKWave.
    cmds:
      - task: lib-view-simulation
        vars:
          board: "ECPIX5"

  compile-firmware:
     desc: Compiles bare metal firmwares.
     cmds:
       - task: lib-baremetal-firmware
         vars:
          board: "SG13G2"
          app: "bootrom"
       - task: lib-baremetal-firmware
         vars:
          board: "SG13G2"
          app: "demo"

  prepare:
    desc: Generates all necessary source files and metadata for chip layout creation.
    cmds:
      - task: lib-generate
        vars:
          board: "SG13G2"
      - task: lib-sealring
        vars:
          board: "SG13G2"

  simulate:
    desc: Runs simulations at the RTL level. Add 'duration=n' to specify the duration in n milliseconds.
    cmds:
      - task: lib-simulate
        vars:
          board: "SG13G2"

  view-simulation:
    desc: Opens the simulation with GTKWave.
    cmds:
      - task: lib-view-simulation
        vars:
          board: "SG13G2"

  layout:
    desc: Creates the physical layout of the chip.
    cmds:
      - task: lib-layout
        vars:
          board: "SG13G2"

  filler:
    desc: Inserts filler cells into the layout to ensure proper chip functionality.
    cmds:
      - task: lib-filler
        vars:
          board: "SG13G2"

  run-drc:
    desc: Performs Design Rule Checks and reports violations; use 'level=minimal' for a basic check.
    cmds:
      - task: lib-run-drc
        vars:
          board: "SG13G2"

  view-drc:
    desc: Displays DRC results in KLayout; 'level=minimal' opens minimal deck results.
    cmds:
      - task: lib-view-drc
        vars:
          board: "SG13G2"

  view-openroad:
    desc: Loads the layout into OpenROAD for further analysis or modification.
    cmds:
      - task: lib-view-openroad
        vars:
          board: "SG13G2"

  view-klayout:
    desc: Opens the chip layout in KLayout for inspection.
    cmds:
      - task: lib-view-klayout
        vars:
          board: "SG13G2"

  check-logs:
    desc: Checks the build directory for warnings or errors in the logs.
    cmds:
      - task: lib-check-logs
        vars:
          board: "SG13G2"

  dt-build-firmware:
    desc: Compiles bare-metal firmware for digital twin testing.
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/software/elemrv_h/pwm_test && make clean && make all && make regtest'

  dt-build-verilated:
    desc: Builds Verilator co-simulation libraries.
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode/verilated/wrappers && make -f Makefile.pwm clean && make -f Makefile.pwm BUILD_MODE=release'

  dt-test:
    desc: Runs all digital twin co-simulation tests (rebuilds first).
    deps: [dt-build-firmware, dt-build-verilated]
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode && bash run_tests.sh'

  dt-test-quick:
    desc: Runs digital twin tests without rebuilding (assumes artifacts exist).
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode && bash run_tests.sh'

  dt-zephyr-init:
    desc: Initializes the Zephyr west workspace and fetches dependencies.
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/software && west init -l elemrv-zephyr 2>/dev/null || true && west update'

  dt-zephyr-build:
    desc: Builds all Zephyr apps for ElemRV-H.
    cmds:
      - docker exec elemrv-test bash -c 'export ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-0.17.0 && export ZEPHYR_BASE=/workspace/elemrv/software/zephyr && cd /workspace/elemrv/software/elemrv-zephyr && bash build_all_apps.sh'

  dt-zephyr-test:
    desc: Builds all Zephyr apps and runs the full test suite.
    deps: [dt-build-firmware, dt-build-verilated, dt-zephyr-build]
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode && bash run_tests.sh'

  dt-cosim-generate:
    desc: Generates all peripheral Verilog via SpinalHDL (requires sbt in Docker).
    cmds:
      - docker exec -w /workspace/elemrv elemrv-test sbt "runMain elemrv_h.test.WishbonePwmVerilog"
      - docker exec -w /workspace/elemrv elemrv-test sbt "runMain elemrv_h.test.WishbonePioVerilog"
      - docker exec -w /workspace/elemrv elemrv-test sbt "runMain elemrv_h.test.WishbonePinmuxVerilog"
      - docker exec -w /workspace/elemrv elemrv-test sbt "runMain elemrv_h.test.WishboneGpioVerilog"
      - docker exec -w /workspace/elemrv elemrv-test sbt "runMain elemrv_h.test.WishboneMachineTimerVerilog"
      - docker exec -w /workspace/elemrv elemrv-test sbt "runMain elemrv_h.test.WishboneI2cControllerVerilog"
      - docker exec -w /workspace/elemrv elemrv-test sbt "runMain elemrv_h.test.WishboneUartVerilog"

  dt-cosim-build:
    desc: Builds all 7 co-simulation shared libraries.
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode/verilated/wrappers && bash build_all_cosim.sh release'

  dt-cosim-test:
    desc: Generates Verilog, builds co-sim libraries, and runs the full test suite.
    deps: [dt-build-firmware, dt-cosim-build]
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode && bash run_tests.sh'

  dt-integration-test:
    desc: Builds firmware + co-sim libs + Zephyr apps and runs the full test suite (52 tests).
    deps: [dt-build-firmware, dt-cosim-build, dt-zephyr-build, dt-n-zephyr-build]
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode && bash run_tests.sh'

  dt-verilator-test:
    desc: Builds and runs pure Verilator testbenches (no Renode).
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode/verilated/testbenches && make run'

  dt-validate-cosim:
    desc: Cross-validates Verilator testbenches against Renode co-sim results.
    deps: [dt-cosim-build]
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode && bash validate_cosim.sh'

  dt-debug-bare-metal:
    desc: Starts Renode with GDB server for bare-metal debugging (port 3333).
    cmds:
      - docker exec -it elemrv-test bash -c 'cd /workspace/elemrv/renode && renode --disable-xwt --console -e "include @debug_bare_metal.resc"'

  dt-debug-zephyr:
    desc: Starts Renode with GDB server for Zephyr debugging (port 3333).
    cmds:
      - docker exec -it elemrv-test bash -c 'cd /workspace/elemrv/renode && renode --disable-xwt --console -e "include @debug_zephyr.resc"'

  dt-debug-cosim:
    desc: Starts Renode with GDB server + full RTL co-simulation (port 3333).
    cmds:
      - docker exec -it elemrv-test bash -c 'cd /workspace/elemrv/renode && renode --disable-xwt --console -e "include @debug_cosim.resc"'

  dt-debug-connect:
    desc: Connects GDB to running Renode debug session.
    cmds:
      - docker exec -it elemrv-test bash -c 'cd /workspace/elemrv && riscv-none-elf-gdb -x renode/gdb/elemrv.gdb {{.ELF | default "software/elemrv_h/pwm_test/pwm_test.elf"}}'

  dt-fault-test:
    desc: Runs fault injection tests (subset of full test suite).
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode && bash run_tests.sh'

  dt-sensor-test:
    desc: Runs I2C sensor capture test.
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode && bash run_tests.sh'

  dt-rtos-debug:
    desc: Starts Renode with GDB server for Zephyr RTOS thread-aware debugging.
    cmds:
      - docker exec -it elemrv-test bash -c 'cd /workspace/elemrv/renode && renode --disable-xwt --console -e "include @debug_zephyr_rtos.resc"'

  dt-rtos-test:
    desc: Runs RTOS debug tests (Tests 41-46).
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode && bash run_tests.sh'

  dt-n-rtos-debug:
    desc: Starts Renode with GDB server for N Zephyr RTOS thread-aware debugging.
    cmds:
      - docker exec -it elemrv-test bash -c 'cd /workspace/elemrv/renode && renode --disable-xwt --console -e "include @debug_zephyr_rtos_n.resc"'

  dt-portable-test:
    desc: Runs portable data logger tests on both H and N (Tests 50-51).
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode && bash run_tests.sh'

  dt-multi-node:
    desc: Runs the multi-node IoT simulation (H edge + N gateway via UART hub).
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode && renode --disable-xwt --console -e "include @run_multi_node.resc"'

  dt-multi-node-test:
    desc: Builds edge+gateway apps and runs multi-node IoT test (Test 52).
    deps: [dt-zephyr-build, dt-n-zephyr-build]
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode && bash run_tests.sh'

  dt-n-cosim-generate:
    desc: Generates N-specific peripheral Verilog via SpinalHDL (requires sbt in Docker).
    cmds:
      - docker exec -w /workspace/elemrv elemrv-test sbt "runMain elemrv_n.test.WishboneGpioNVerilog"
      - docker exec -w /workspace/elemrv elemrv-test sbt "runMain elemrv_n.test.WishbonePinmuxNVerilog"
      - docker exec -w /workspace/elemrv elemrv-test sbt "runMain elemrv_n.test.WishboneSpiControllerVerilog"
      - docker exec -w /workspace/elemrv elemrv-test sbt "runMain elemrv_n.test.WishboneI2cLiteVerilog"
      - docker exec -w /workspace/elemrv elemrv-test sbt "runMain elemrv_n.test.WishboneUartLiteVerilog"

  dt-n-cosim-build:
    desc: Builds all 5 N-specific co-simulation shared libraries.
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode/verilated/wrappers && bash build_n_cosim.sh release'

  dt-n-zephyr-build:
    desc: Builds N Zephyr apps (hello_world, blinky).
    cmds:
      - docker exec elemrv-test bash -c 'export ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-0.17.0 && export ZEPHYR_BASE=/workspace/elemrv/software/zephyr && cd /workspace/elemrv/software/elemrv-zephyr && bash build_n_apps.sh'

  dt-n-test:
    desc: Full N test suite (generates, builds, tests).
    deps: [dt-n-cosim-build, dt-n-zephyr-build]
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode && bash run_tests.sh'

  dt-n-test-quick:
    desc: Runs N tests without rebuild (assumes artifacts exist).
    cmds:
      - docker exec elemrv-test bash -c 'cd /workspace/elemrv/renode && bash run_tests.sh'

  default:
    desc: Executes the full IHP SG13G2 RTL-to-GDSII flow and validates the layout afterwards.
    cmds:
      - task: prepare
      - task: layout
      - task: filler
      - task: run-drc
      - task: check-logs
